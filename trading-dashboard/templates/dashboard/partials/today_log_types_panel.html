<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
  <h2 class="text-xl font-semibold">今日日志类型概览</h2>
  <div class="flex flex-wrap gap-2 mt-4">
    {% for item in today_type_summary %}
    <span class="px-3 py-1.5 rounded-full bg-slate-800 text-slate-200 text-sm border border-slate-700">{{ item.label }} × {{ item.count }}</span>
    {% empty %}
    <div class="text-slate-400">今天还没有日志类型记录。</div>
    {% endfor %}
  </div>
</div>
