<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
  <h2 class="text-xl font-semibold">最新日志摘要</h2>
  <div class="space-y-3 mt-4">
    {% for log in latest_logs|slice:':5' %}
    <div class="rounded-xl border border-slate-800 p-4 bg-slate-950/50">
      <div class="font-medium">{{ log.title }}</div>
      <div class="text-slate-400 text-sm mt-1">{{ log.log_date }} {% if log.log_time %}{{ log.log_time }}{% endif %} ｜ {{ log.get_log_type_display }}</div>
      {% if log.summary %}<div class="text-slate-300 text-sm mt-2">{{ log.summary }}</div>{% endif %}
    </div>
    {% empty %}
    <div class="text-slate-400">暂无日志摘要。</div>
    {% endfor %}
  </div>
</div>
