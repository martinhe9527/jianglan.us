<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
    <div class="text-slate-400 text-sm">持仓数量</div>
    <div class="text-3xl font-bold mt-2">{{ holdings|length }}</div>
  </div>
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
    <div class="text-slate-400 text-sm">监测池数量</div>
    <div class="text-3xl font-bold mt-2">{{ watchlist|length }}</div>
  </div>
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
    <div class="text-slate-400 text-sm">今日日志积分</div>
    <div class="text-3xl font-bold mt-2">{{ today_points }}</div>
  </div>
</div>
